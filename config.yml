# SuperCars car list (auto-generated structure; edit freely)
# speed   : horse movement speed (0.225 = normal horse, 0.6 = fast, 1.0 = hypercar)
# color   : body block shown for the car (any block material, e.g. RED_CONCRETE)
# brand   : used for /supercar list <brand> and grouping in the garage menu

settings:
  allow-pickup: true            # sneak + right click your car to pick it back up
  exhaust-particles: true
  max-cars-per-player: 3        # placed at the same time (admins unlimited)
  use-resource-pack-models: false   # true = car items use item model supercars:<car_id> from your resource pack

